
name: ai-cloud-monitoring

services:

  dashboard:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboards/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "127.0.0.1:8502:8501"
    restart: unless-stopped

  ai-detector:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - src/ml/detect_anomaly.py
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  alert-manager:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - src/alerts/alert_manager.py
    restart: unless-stopped
